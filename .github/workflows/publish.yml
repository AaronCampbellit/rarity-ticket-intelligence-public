name: Publish reviewed images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: Publish ${{ matrix.component }}
    # Portfolio copies run CI without publishing/signing container releases.
    if: >-
      github.repository == 'AaronCampbellit/rarity-ticket-intelligence' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            dockerfile: infrastructure/compose/api.Dockerfile
          - component: frontend
            dockerfile: infrastructure/compose/frontend.Dockerfile
    steps:
      - name: Check out reviewed main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Derive lowercase image reference
        id: image
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          image_ref="$(printf '%s/%s-%s' "$REGISTRY" "$GITHUB_REPOSITORY" "$COMPONENT" | tr '[:upper:]' '[:lower:]')"
          printf 'ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Derive immutable image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.ref }}
          tags: |
            type=raw,value=candidate-${{ github.event.workflow_run.head_sha }}-${{ github.run_attempt }}
          labels: |
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and publish reviewed image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: https://github.com/${{ github.repository }}.git#${{ github.event.workflow_run.head_sha }}
          file: ${{ matrix.dockerfile }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            RARITY_BUILD_REVISION=${{ github.event.workflow_run.head_sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Scan the published digest
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig,license
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Keyless-sign the immutable digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Verify the published signature
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SIGNING_IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/publish.yml@refs/heads/main
        run: |
          cosign verify \
            --certificate-identity "${SIGNING_IDENTITY}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"

      - name: Promote the verified digest
        env:
          IMAGE: ${{ steps.image.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${REVISION}" \
            --tag "${IMAGE}:main" \
            "${IMAGE}@${DIGEST}"
