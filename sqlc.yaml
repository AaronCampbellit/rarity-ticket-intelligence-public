version: "2"
sql:
  - engine: "postgresql"
    schema: "backend/migrations"
    queries: "backend/internal/store/sql"
    gen:
      go:
        package: "generated"
        out: "backend/internal/store/generated"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_empty_slices: true
        emit_pointers_for_null_types: true
